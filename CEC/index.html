<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Exchange Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>

<body class="bg-light">
    <header class="bg-white border-bottom">
        <nav class="navbar navbar-expand-lg py-3">
            <div class="container-xl">
                <a class="navbar-brand" href="#">Currency Exchange Calculator</a>
            </div>
        </nav>
    </header>

    <main class="container-xl py-5">
        <section class="mb-4">
            <h1 class="display-5 fw-semibold mb-2">Конвертер валют</h1>
            <p class="lead text-secondary mb-0">Розрахунок курсу валют до гривні</p>
        </section>

        <div class="row g-4 align-items-stretch">
            <div class="col-12 col-lg-4">
                <section class="card h-100 shadow-sm">
                    <div class="card-body p-4">
                        <h2 class="h4 card-title mb-4">Параметри</h2>

                        <form id="exchangeForm" class="needs-validation" novalidate>
                            <div class="mb-3">
                                <label class="form-label" for="currency">Валюта</label>
                                <select class="form-select form-select-lg" id="currency" name="currency" required>
                                    <!-- <option value="USD" selected>USD — Долар США</option>
                                    <option value="EUR">EUR — Євро</option>
                                    <option value="PLN">PLN — Польський злотий</option>
                                    <option value="GBP">GBP — Фунт стерлінгів</option> -->
                                    <option value="" disabled selected>Оберіть валюту</option>
                                </select>
                            </div>

                            <div class="mb-3">
                                <label class="form-label" for="targetCurrency">У гривні (UAH)</label>
                                <input class="form-control form-control-lg" id="targetCurrency" type="text"
                                    value="UAH — Українська гривня" disabled>
                            </div>

                            <div class="row g-3 mb-4">
                                <div class="col-sm-6">
                                    <label class="form-label" for="dateFrom">З</label>
                                    <input class="form-control" id="dateFrom" name="dateFrom" type="date"
                                        value="2026-07-01">
                                </div>
                                <div class="col-sm-6">
                                    <label class="form-label" for="dateTo">По</label>
                                    <input class="form-control" id="dateTo" name="dateTo" type="date"
                                        value="2026-07-15">
                                </div>
                            </div>

                            <button class="btn btn-primary btn-lg w-100" type="submit">Розрахувати</button>
                        </form>
                    </div>
                </section>
            </div>

            <div class="col-12 col-lg-8">
                <section class="card h-100 shadow-sm">
                    <div class="card-body p-4">
                        <div
                            class="d-flex flex-column flex-sm-row justify-content-between align-items-sm-center gap-3 mb-4">
                            <h2 class="h4 mb-0">Динаміка курсу <span id="selectedCurrencyDisplay">USD</span> / UAH</h2>
                        </div>

                        <div class="ratio ratio-16x9 mb-4">
                            <canvas id="exchangeRateChart"></canvas>
                        </div>

                        <hr>

                        <div class="row g-3 text-center pt-2">
                            <div class="col-12 col-sm-4">
                                <p class="text-secondary mb-1">Мінімум</p>
                                <p class="h4 mb-0" id="minVal">N/A</p>
                            </div>
                            <div class="col-12 col-sm-4 border-sm-start border-sm-end">
                                <p class="text-secondary mb-1">Середній</p>
                                <p class="h4 mb-0" id="avgVal">N/A</p>
                            </div>
                            <div class="col-12 col-sm-4">
                                <p class="text-secondary mb-1">Максимум</p>
                                <p class="h4 mb-0" id="maxVal">N/A</p>
                            </div>
                        </div>
                    </div>
                </section>
            </div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="js/nbu.js"></script>
</body>

</html>
