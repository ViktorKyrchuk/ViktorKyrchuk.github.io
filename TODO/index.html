<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo List Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
</head>

<body class="bg-light overflow-hidden">
    <main class="container vh-100 d-flex align-items-center justify-content-center py-5 overflow-hidden">
        <div class="row w-100 h-100 justify-content-center align-items-center overflow-hidden">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 h-100 d-flex align-items-center overflow-hidden">
                <section class="card border-0 shadow-sm w-100 h-100 mh-100 d-flex flex-column overflow-hidden">
                    <div class="card-body h-100 p-4 p-md-5 d-flex flex-column gap-3 overflow-hidden">
                        <div class="text-center mb-3 mb-md-4 flex-shrink-0">
                            <div class="material-symbols-outlined text-primary fs-1 mb-2">ToDo List</div>
                        </div>

                        <div class="input-group input-group-lg flex-shrink-0">
                            <input type="text" class="form-control" id="toDoInput" placeholder="Create a new task"
                                aria-label="New task" />
                            <button class="btn btn-primary px-4" type="button" id="addToDoBtn">
                                ADD
                            </button>
                        </div>

                        <fieldset class="border rounded-3 p-3 p-md-4 d-flex flex-column flex-grow-1 overflow-hidden">
                            <legend class="float-none w-auto px-2 h6 text-secondary flex-shrink-0">
                                <div class="d-flex align-items-center justify-content-between gap-2">
                                    <div class="material-symbols-outlined">Tasks</div>
                                    <div class="badge text-bg-primary rounded-pill" id="tasksCount">0</div>
                                </div>
                            </legend>

                            <ul class="list-group flex-grow-1 overflow-auto" id="toDoListItems" style="scrollbar-width: thin;">
                                <!-- <li class="list-group-item list-group-item-action d-flex justify-content-between align-items-start gap-3 py-3" role="button">
                                <div>
                                    <div class="fw-semibold">Купити хліб</div>
                                    <small class="text-secondary">Початок: 2026-01-01 22:22</small>
                                </div>
                                <span class="badge text-bg-warning rounded-pill">todo</span>
                                </li> -->
                            </ul>
                        </fieldset>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
<script src="js/toDo.js"></script>

</html>
