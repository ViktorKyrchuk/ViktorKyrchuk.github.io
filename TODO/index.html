<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo List Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        .todo-card {
            max-height: calc(100vh - 2rem);
            max-height: calc(100dvh - 2rem);
        }

        .todo-card .card-body,
        .todo-list-wrapper,
        #toDoListItems {
            min-height: 0;
        }
    </style>
</head>

<body class="bg-light">
    <main class="container min-vh-100 d-flex align-items-center justify-content-center py-3">
        <div class="row w-100 justify-content-center">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5">
                <section class="todo-card card border-0 shadow-sm w-100 d-flex flex-column overflow-hidden">
                    <div class="card-body p-4 p-md-5 d-flex flex-column gap-3 overflow-hidden">
                        <div class="text-center mb-3 mb-md-4 flex-shrink-0">
                            <h1 class="h3 fw-bold mb-2">ToDo List</h1>
                            <p class="text-secondary mb-0">
                                HTML5, Bootstrap 5 and JavaScript
                                <small class="d-block text-muted small">
                                    LocalStorage is used to save the tasks in the browser.
                                </small>
                            </p>
                        </div>

                        <div class="input-group input-group-lg flex-shrink-0">
                            <input type="text" class="form-control" id="toDoInput" placeholder="Create a new task"
                                aria-label="New task" />
                            <button class="btn btn-primary px-4" type="button" id="addToDoBtn">
                                ADD
                            </button>
                        </div>

                        <fieldset class="todo-list-wrapper border rounded-3 p-3 p-md-4 d-flex flex-column overflow-hidden">
                            <legend class="float-none w-auto px-2 h6 text-secondary flex-shrink-0">
                                ToDo List Items
                            </legend>

                            <ul class="list-group overflow-auto" id="toDoListItems" style="scrollbar-width: thin;">
                            </ul>
                        </fieldset>
                    </div>
                </section>
            </div>
        </div>
    </main>
</body>
<script src="js/toDo.js"></script>

</html>
