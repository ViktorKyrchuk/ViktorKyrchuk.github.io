<!doctype html>
<html lang="uk">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>ToDo List Design</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
        #toDoListItems {
            max-height: calc(100vh - 22rem);
            max-height: calc(100dvh - 22rem);
            min-height: 0;
        }
    </style>
</head>

<body class="bg-light overflow-hidden">
    <main class="container vh-100 d-flex align-items-center justify-content-center py-3 overflow-hidden">
        <div class="row w-100 h-100 justify-content-center overflow-hidden">
            <div class="col-12 col-sm-10 col-md-8 col-lg-6 col-xl-5 h-100 d-flex align-items-center overflow-hidden">
                <section class="card border-0 shadow-sm w-100 mh-100 d-flex flex-column overflow-hidden">
                    <div class="card-body mh-100 p-4 d-flex flex-column gap-3 overflow-hidden">
                        <div class="text-center mb-3 mb-md-4 flex-shrink-0">
                            <div class="material-symbols-outlined text-primary fs-1 mb-2">ToDo List</div>
                        </div>

                        <div class="input-group input-group-lg flex-shrink-0">
                            <input type="text" class="form-control" id="toDoInput" placeholder="Create a new task"
                                aria-label="New task" />
                            <button class="btn btn-primary px-4" type="button" id="addToDoBtn">
                                ADD
                            </button>
                        </div>

                        <fieldset class="border rounded-3 p-3 p-md-4 d-flex flex-column flex-shrink-1 overflow-hidden">
                            <legend class="float-none w-auto px-2 h6 text-secondary flex-shrink-0">
                                <div class="d-flex align-items-center justify-content-between gap-2">
                                    <div class="material-symbols-outlined">Tasks</div>
                                    <div class="badge text-bg-primary rounded-pill" id="tasksCount">0</div>
                                </div>
                            </legend>

                            <ul class="list-group overflow-auto" id="toDoListItems">
                            </ul>
                        </fieldset>
                    </div>
                </section>
            </div>
        </div>
    </main>
    <script src="js/toDo.js"></script>
</body>

</html>
